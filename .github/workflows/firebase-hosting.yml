name: Firebase Hosting

# main -> live (https://strassenzeichner.web.app)
# Pull Request -> eigene Vorschau-URL (7 Tage gültig)
# Anmeldung bei Google per Workload Identity Federation: kein Schlüssel/Secret nötig.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      FIREBASE_PROJECT: strassenzeichner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Die Kartendatei (82 MB) liegt nicht im Repo, sondern wird von der Live-Seite übernommen.
      - name: Kartendatei übernehmen
        run: curl -fsSL -o dist/berlin.pmtiles https://strassenzeichner.web.app/berlin.pmtiles

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/520985181364/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-action-hosting@strassenzeichner.iam.gserviceaccount.com

      - name: Live-Deploy
        if: github.event_name != 'pull_request'
        run: npx -y firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

      - name: Vorschau-Deploy
        if: github.event_name == 'pull_request'
        run: |
          npx -y firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --expires 7d --project "$FIREBASE_PROJECT" --non-interactive --json > channel.json
          url=$(jq -r '.result[].url' channel.json | head -1)
          echo "Vorschau: $url" | tee -a "$GITHUB_STEP_SUMMARY"
