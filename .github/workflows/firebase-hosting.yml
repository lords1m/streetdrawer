name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Die Kartendatei (82 MB) liegt nicht im Repo, sondern wird von der Live-Seite übernommen.
      - name: Kartendatei übernehmen
        run: curl -fsSL -o dist/berlin.pmtiles https://strassenzeichner.web.app/berlin.pmtiles
      # main -> live, Pull Request -> Vorschau-URL (7 Tage)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRASSENZEICHNER }}
          projectId: strassenzeichner
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
